name: Neon backup test (dev)

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/check-neon-backup.yml
      - scripts/check_neon_backup_ci.py
      - salon_cost_bot/backups.py
      - salon_cost_bot/database.py

permissions:
  contents: read

jobs:
  backup-check:
    name: Check test Neon snapshot (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout dev code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check 'asyncpg==0.32.0'
      - name: Check test Neon export and integrity
        env:
          NEFOR_TEST_NEON_URL: ${{ secrets.NEFOR_TEST_NEON_URL }}
        run: python scripts/check_neon_backup_ci.py
